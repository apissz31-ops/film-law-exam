<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>영화속법 중간고사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one 660px column of court-docket panels, sticky tab bar on top, gold rules mark section breaks */
:root {
  --bg: #f3f4f8;
  --paper: #ffffff;
  --ink: #18203a;
  --muted: #5a6382;
  --line: #d8dbe6;
  --navy: #1d2b53;
  --navy-soft: #e6e9f3;
  --gold: #a67c1e;
  --gold-soft: #f6edd6;
  --movie: #9a5b12;
  --movie-bg: #fbeedd;
  --law: #2a4c8f;
  --law-bg: #e3eaf8;
  --ok: #1d7a4a;
  --ok-bg: #e2f3ea;
  --bad: #b3322a;
  --bad-bg: #fbe5e2;
  --warn: #8a5a00;
  --warn-bg: #fff1cc;
  --display: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1424; --paper: #182039; --ink: #e8eaf2; --muted: #9aa3c0; --line: #2c3657;
    --navy: #c9d3f2; --navy-soft: #222c4a; --gold: #d9b45c; --gold-soft: #3a3120;
    --movie: #f0b56a; --movie-bg: #3b2a14; --law: #9bb8f2; --law-bg: #1f2d50;
    --ok: #6fd39c; --ok-bg: #173a29; --bad: #f08b80; --bad-bg: #44201d; --warn: #f2c35e; --warn-bg: #3d3010;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1424; --paper: #182039; --ink: #e8eaf2; --muted: #9aa3c0; --line: #2c3657;
  --navy: #c9d3f2; --navy-soft: #222c4a; --gold: #d9b45c; --gold-soft: #3a3120;
  --movie: #f0b56a; --movie-bg: #3b2a14; --law: #9bb8f2; --law-bg: #1f2d50;
  --ok: #6fd39c; --ok-bg: #173a29; --bad: #f08b80; --bad-bg: #44201d; --warn: #f2c35e; --warn-bg: #3d3010;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy-soft); }
.wrap { max-width: 660px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 0; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.35rem; margin: 0; color: var(--navy); letter-spacing: -0.01em; }
.brand small { color: var(--gold); font-size: 0.75rem; letter-spacing: 0.08em; }
nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 10px; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 4px 9px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--gold); }
h2 { font-family: var(--display); font-weight: 800; font-size: 1.2rem; color: var(--navy); margin: 26px 0 10px; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 700; font-size: 1.02rem; color: var(--navy); margin: 18px 0 8px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
button.btn, select.sel { font: inherit; font-size: 0.9rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 8px 12px; cursor: pointer; min-height: 40px; }
button.btn:focus-visible, select.sel:focus-visible, input:focus-visible, nav.tabs button:focus-visible, .seg button:focus-visible, .flip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button.btn.primary { background: var(--navy); color: var(--paper); border-color: var(--navy); }
button.btn.on { background: var(--gold-soft); border-color: var(--gold); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--paper); }
.seg button { font: inherit; font-size: 0.88rem; border: 0; background: none; padding: 8px 12px; color: var(--muted); cursor: pointer; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--paper); }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag.movie { background: var(--movie-bg); color: var(--movie); }
.tag.law { background: var(--law-bg); color: var(--law); }
.tag.wk { background: var(--navy-soft); color: var(--navy); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.gichul { background: var(--gold-soft); color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.tips { margin: 0; padding-left: 1.2em; }
.tips li + li { margin-top: 4px; }
.bar { height: 8px; background: var(--navy-soft); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .3s; }
/* home */
.weeks { display: grid; gap: 10px; }
.wkrow { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; }
.wkrow b { font-family: var(--display); color: var(--gold); font-size: 0.95rem; }
.wkrow .t { min-width: 0; }
.wkrow .t div:first-child { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.stat .v { font-family: var(--mono); font-size: 1.4rem; color: var(--navy); font-variant-numeric: tabular-nums; }
.stat .k { font-size: 0.78rem; color: var(--muted); }
.sets { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.sets .stat { text-align: center; padding: 10px 4px; }
/* cards */
.flip { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 12px; padding: 22px 18px; min-height: 230px; cursor: pointer; }
.flip .side { font-size: 0.72rem; letter-spacing: 0.1em; color: var(--gold); font-weight: 600; }
.flip .front { font-family: var(--display); font-weight: 700; font-size: 1.22rem; color: var(--navy); margin: 10px 0; text-wrap: balance; }
.flip .ans { font-size: 1.15rem; font-weight: 600; margin: 10px 0 6px; }
.flip .pt { color: var(--muted); font-size: 0.92rem; }
.flip.back { border-top-color: var(--navy); }
.cardmeta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.judge { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.judge .no { background: var(--bad-bg); color: var(--bad); border-color: transparent; font-weight: 600; }
.judge .yes { background: var(--ok-bg); color: var(--ok); border-color: transparent; font-weight: 600; }
.pager { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.list { display: grid; gap: 8px; }
.li { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.li .q { font-weight: 600; }
.li .a { margin-top: 4px; }
.li .p { color: var(--muted); font-size: 0.86rem; }
.chip { font-size: 0.72rem; padding: 1px 7px; border-radius: 999px; }
.chip.k { background: var(--ok-bg); color: var(--ok); }
.chip.u { background: var(--bad-bg); color: var(--bad); }
/* story */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; min-width: 520px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--navy-soft); color: var(--navy); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.acts { display: grid; gap: 12px; }
.act { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.act h4 { margin: 0 0 6px; font-family: var(--display); color: var(--gold); font-size: 0.95rem; }
.act ol { margin: 0; padding-left: 1.3em; }
.act li + li { margin-top: 4px; }
ul.plain { margin: 0; padding-left: 1.2em; }
ul.plain li + li { margin-top: 4px; }
/* exam */
.timer { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h, 98px) + 6px); z-index: 4; background: var(--navy); color: var(--paper); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.timer .clock { font-family: var(--mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.timer .clock.late { color: var(--gold); }
.timer button { font: inherit; font-size: 0.85rem; background: transparent; color: var(--paper); border: 1px solid currentColor; border-radius: 7px; padding: 6px 10px; cursor: pointer; min-height: 36px; }
.timer .goal { font-size: 0.78rem; opacity: 0.8; width: 100%; }
.qs { display: grid; gap: 12px; margin-top: 12px; }
.qcard { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.qcard.ok { border-color: var(--ok); }
.qcard.bad { border-color: var(--bad); }
.qhead { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.qno { font-family: var(--mono); color: var(--gold); font-weight: 500; }
.qtext { font-weight: 500; }
.ansrow { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; margin-top: 10px; }
.ansrow input { font: inherit; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 40px; }
.fb { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.92rem; }
.fb.ok { background: var(--ok-bg); }
.fb.bad { background: var(--bad-bg); }
.fb b.r { color: var(--ok); }
.fb b.w { color: var(--bad); }
.score { margin-top: 16px; }
.score .big { font-family: var(--display); font-size: 1.6rem; color: var(--navy); }
.note { font-size: 0.82rem; color: var(--muted); border-left: 3px solid var(--gold); padding-left: 10px; }
@media (max-width: 420px) {
  .ansrow { grid-template-columns: 1fr 1fr; }
  .ansrow input { grid-column: 1 / -1; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .sets { grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .sets .stat .v { font-size: 1.15rem; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>영화 속 법 · 중간고사</h1><small>2026-2 · 2–7주차</small></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="home" aria-selected="true">홈</button>
      <button role="tab" data-tab="cards" aria-selected="false">단어장</button>
      <button role="tab" data-tab="story" aria-selected="false">줄거리</button>
      <button role="tab" data-tab="exam" aria-selected="false">모의고사</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<script>
/* =====================================================================
   데이터 영역 — 문제·카드를 고칠 때는 이 아래 배열만 수정하면 됩니다.
   카드: { week, type:"movie"|"law", term, hint, answer, point, uncertain, gichul }
   문제: { set, no, week, type, kind:"blank"|"short", q, answers[], explain, uncertain, gichul }
     - gichul: true → 선배 족보에 나온 항목 (★ 기출 뱃지, 단어장 '기출만' 필터)
     - set 6 = 족보 키워드만 모은 '기출 세트'
     - answers 첫 번째가 화면에 보여 주는 정답, 나머지는 허용 표기
     - 채점은 공백·대소문자·구두점·기호를 무시하고 비교
   ===================================================================== */

const WEEKS = {
  2: { title: "데드 맨 워킹", en: "Dead Man Walking", year: 1995 },
  3: { title: "단지 그대가 여자라는 이유만으로", en: "", year: 1990 },
  4: { title: "투 가이즈", en: "Two Guys", year: 2004 },
  5: { title: "타임 투 킬", en: "A Time to Kill", year: 1996 },
  6: { title: "아이 엠 샘", en: "I Am Sam", year: 2001 },
  7: { title: "에린 브로코비치", en: "Erin Brockovich", year: 2000 }
};

const CARDS = [
  // ───────── 2주차 데드 맨 워킹 · 영화 ─────────
  { week: 2, type: "movie", term: "감독", answer: "팀 로빈스 (Tim Robbins)", point: "원작은 헬렌 프레진 수녀의 논픽션 『데드 맨 워킹』(1993)." },
  { week: 2, type: "movie", term: "헬렌 프레진의 신분", gichul: true, answer: "수녀 (Sister Helen Prejean)", point: "배우 수전 서랜든. 이 역으로 아카데미 여우주연상 수상." },
  { week: 2, type: "movie", term: "헬렌이 일하는 곳", answer: "호프 하우스 (Hope House)", point: "뉴올리언스의 흑인 빈민가(세인트토머스 프로젝트)." },
  { week: 2, type: "movie", term: "사형수 매튜 폰슬렛 역 배우", gichul: true, answer: "숀 펜", point: "숀 펜은 베를린영화제 은곰상(남우주연상)을 받았다." },
  { week: 2, type: "movie", term: "폰슬렛이 수감된 교도소", answer: "루이지애나 주립교도소 (앙골라)", point: "배경은 루이지애나주." },
  { week: 2, type: "movie", term: "폰슬렛이 사형수 감방에 있던 기간", answer: "6년", point: "영화가 시작될 때 기준." },
  { week: 2, type: "movie", term: "폰슬렛의 죄목", answer: "10대 커플 납치·강간·살인", point: "피해자는 월터 델라크루아와 호프 퍼시." },
  { week: 2, type: "movie", term: "피해자 두 사람의 이름", answer: "월터 델라크루아 · 호프 퍼시", point: "정확한 나이는 영화 설명에서 확인되지 않음." },
  { week: 2, type: "movie", term: "공범 칼 비텔로가 받은 형", answer: "가석방 없는 종신형", point: "같은 범죄인데 폰슬렛은 사형 → 형량 불균형 문제." },
  { week: 2, type: "movie", term: "폰슬렛을 무료로 변호한 변호사", answer: "힐튼 바버 (Hilton Barber)", point: "프로보노(pro bono)로 맡음. 배우 로버트 프로스키." },
  { week: 2, type: "movie", term: "사면위원회 청문회에서 바버가 강조한 점", answer: "경험 없는 국선변호인 때문에 제대로 변호받지 못했다", point: "요지: 돈 있는 사람은 사형수 감방에 없다." },
  { week: 2, type: "movie", term: "사면위원회가 감형을 거부한 뒤 집행까지", answer: "1주일", point: "청문회 → 감형 거부 → 1주일 뒤 집행." },
  { week: 2, type: "movie", term: "피해자 아버지들의 이름", answer: "얼 델라크루아(월터의 아버지) · 클라이드 퍼시(호프의 아버지)", point: "호프의 어머니는 메리 베스 퍼시." },
  { week: 2, type: "movie", term: "피해자 가족들이 원한 것", answer: "\"완전한 정의\" = 사형 집행", point: "그래서 헬렌이 살인자 편을 든다고 비난." },
  { week: 2, type: "movie", term: "폰슬렛의 어머니 이름", answer: "루실 (Lucille)", point: "청문회에 아들 크레이그와 함께 나옴. 형제는 크레이그·소니·트로이." },
  { week: 2, type: "movie", term: "폰슬렛이 TV 인터뷰에서 칭찬한 인물", answer: "히틀러", point: "\"지도자\"라고 칭찬 → 헬렌이 '사람들이 당신을 죽이기 쉬워진다'고 꾸짖음." },
  { week: 2, type: "movie", term: "거짓말탐지기 검사 결과", answer: "판정 불가 (inconclusive)", point: "스트레스 반응 때문에 결론이 나지 않음." },
  { week: 2, type: "movie", term: "영화 속 사형 집행 방식", gichul: true, answer: "약물주사 (lethal injection)", point: "실제 모델 사건은 전기의자로 집행됨." },
  { week: 2, type: "movie", term: "집행 직전 폰슬렛의 자백 내용", gichul: true, answer: "월터는 자기가 죽이고 호프를 강간함. 호프는 비텔로가 죽임", point: "끝까지 비텔로 탓을 하다가 마지막에 책임을 인정." },
  { week: 2, type: "movie", term: "헬렌이 마지막에 해 준 말 (요지)", answer: "마지막으로 보는 얼굴이 '사랑의 얼굴'이 되겠다", point: "집행 때 헬렌을 바라보라는 뜻." },
  { week: 2, type: "movie", term: "폰슬렛의 마지막 발언 (요지)", answer: "월터 아버지에게 사과, 퍼시 부부에게 '내 죽음이 위안이 되길', '누가 하든 살인은 잘못'", point: "국가의 사형도 살인이라는 메시지." },

    data,
    save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

})();

/* ---------- 단어장 ---------- */
function wrongCards() {
  return QUESTIONS.filter(q => S.wrong[qId(q)]).map(q => ({ week: q.week, type: q.type, term: q.q, answer: q.answers[0], point: q.explain, uncertain: q.uncertain, gichul: q.gichul, _q: qId(q) }));
}
function cardPool() {
  const c = ui.cards;
  let pool = c.kind === "wrong" ? wrongCards() : CARDS.filter(x => c.kind === "all" || x.type === c.kind);
  if (c.week !== "all") pool = pool.filter(x => x.week == c.week);
  if (c.unknownOnly && c.kind !== "wrong") pool = pool.filter(x => S.known[cardId(x)] !== true);
  if (c.gichulOnly) pool = pool.filter(x => x.gichul);
  if (c.order) {
    const rank = new Map(c.order.map((id, i) => [id, i]));
    pool = pool.slice().sort((a, b) => (rank.get(keyOf(a)) ?? 1e9) - (rank.get(keyOf(b)) ?? 1e9));
  }
  return pool;
}
const keyOf = x => x._q || cardId(x);

function renderCards() {
  const c = ui.cards;
  const pool = cardPool();
  if (c.i >= pool.length) c.i = Math.max(0, pool.length - 1);
  const knownN = pool.filter(x => x._q ? false : S.known[cardId(x)] === true).length;
  const pct = pool.length ? Math.round(knownN / pool.length * 100) : 0;
  const seg = [["all", "전체"], ["movie", "영화 내용"], ["law", "프린트(법)"], ["wrong", "틀린 문제"]]
    .map(([k, l]) => `<button aria-pressed="${c.kind === k}" data-kind="${k}">${l}</button>`).join("");
  const opts = `<option value="all">전체 주차</option>` + Object.keys(WEEKS).map(w => `<option value="${w}" ${c.week == w ? "selected" : ""}>${w}주차 · ${esc(WEEKS[w].title)}</option>`).join("");
  let body = "";
  if (!pool.length) {
    body = `<div class="panel muted">${c.kind === "wrong" ? "아직 틀린 문제가 없어요. 모의고사에서 틀리거나 '정답 보기'를 누른 문제가 여기에 모여요." : c.unknownOnly ? "이 범위의 카드를 모두 '알아요'로 표시했어요." : "이 조건에 맞는 카드가 없어요. 4·5주차는 강의자료 범위가 아니라 법 카드가 없어요."}</div>`;
  } else if (c.list) {
    body = `<div class="list">${pool.map(x => {
      const st = x._q ? "" : S.known[cardId(x)] === true ? '<span class="chip k">알아요</span>' : S.known[cardId(x)] === false ? '<span class="chip u">몰라요</span>' : "";
      return `<div class="li"><div class="cardmeta"><span class="tag wk">${weekLabel(x.week)}</span>${typeTag(x.type)}${gichulTag(x.gichul)}${warnTag(x.uncertain)}${st}</div><div class="q">${esc(x.term)}</div><div class="a">${esc(x.answer)}</div>${x.point ? `<div class="p">${esc(x.point)}</div>` : ""}</div>`;
    }).join("")}</div>`;
  } else {
    const x = pool[c.i];
    const face = c.flipped
      ? `<div class="side">답</div><div class="front" style="font-size:1rem">${esc(x.term)}</div><div class="ans">${esc(x.answer)}</div>${x.point ? `<div class="pt">${esc(x.point)}</div>` : ""}`
      : `<div class="side">질문 · 탭해서 뒤집기</div><div class="front">${esc(x.term)}</div>${x.hint ? `<div class="pt">힌트: ${esc(x.hint)}</div>` : ""}`;
    body = `
      <div class="cardmeta"><span class="tag wk">${weekLabel(x.week)} · ${esc(WEEKS[x.week].title)}</span>${typeTag(x.type)}${gichulTag(x.gichul)}${warnTag(x.uncertain)}</div>
      <button class="flip ${c.flipped ? "back" : ""}" id="flip" aria-label="카드 뒤집기">${face}</button>
      <div class="judge"><button class="btn no" id="no">몰라요</button><button class="btn yes" id="yes">${x._q ? "이제 알아요 (목록에서 빼기)" : "알아요"}</button></div>
      <div class="pager"><button class="btn" id="prev">← 이전</button><span class="num">${c.i + 1} / ${pool.length}</span><button class="btn" id="next">다음 →</button></div>`;
  }
  view.innerHTML = `
    <h2>단어장</h2>
    <div class="row"><div class="seg">${seg}</div></div>
    <div class="row" style="margin-top:8px">
      <select class="sel" id="wk" aria-label="주차 선택">${opts}</select>
      <button class="btn ${c.gichulOnly ? "on" : ""}" id="gich">★ 기출만</button>
      <button class="btn ${c.unknownOnly ? "on" : ""}" id="unk">모르는 것만</button>
      <button class="btn ${c.order ? "on" : ""}" id="shuf">섞기</button>
      <button class="btn ${c.list ? "on" : ""}" id="lst">목록 보기</button>
    </div>
    <div style="margin:14px 0 12px"><div class="row" style="justify-content:space-between"><span class="small muted">이 범위에서 외운 카드</span><span class="num">${knownN}/${pool.length}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
    ${body}`;
  view.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { c.kind = b.dataset.kind; c.i = 0; c.flipped = false; renderCards(); });
  $("#wk").onchange = e => { c.week = e.target.value; c.i = 0; c.flipped = false; renderCards(); };
  $("#unk").onclick = () => { c.unknownOnly = !c.unknownOnly; c.i = 0; c.flipped = false; renderCards(); };
  $("#gich").onclick = () => { c.gichulOnly = !c.gichulOnly; c.i = 0; c.flipped = false; renderCards(); };
  $("#shuf").onclick = () => {
    if (c.order) c.order = null;
    else { const ids = cardPool().map(keyOf); for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; } c.order = ids; }
    c.i = 0; c.flipped = false; renderCards();
  };
  $("#lst").onclick = () => { c.list = !c.list; renderCards(); };
  if (!c.list && pool.length) {
    const x = pool[c.i];
    $("#flip").onclick = () => { c.flipped = !c.flipped; renderCards(); };
    $("#prev").onclick = () => { c.i = (c.i - 1 + pool.length) % pool.length; c.flipped = false; renderCards(); };
    $("#next").onclick = () => { c.i = (c.i + 1) % pool.length; c.flipped = false; renderCards(); };
    $("#no").onclick = () => { if (!x._q) { S.known[cardId(x)] = false; store.save(); } c.i = (c.i + 1) % pool.length; c.flipped = false; renderCards(); };
    $("#yes").onclick = () => {
      if (x._q) { delete S.wrong[x._q]; } else { S.known[cardId(x)] = true; }
      store.save();
      if (!x._q && !c.unknownOnly) c.i = (c.i + 1) % pool.length;
      c.flipped = false; renderCards();
    };
  }
}

/* ---------- 줄거리 ---------- */
function renderStory() {
  const w = ui.story, s = STORIES[w], m = WEEKS[w];
  const btns = Object.keys(WEEKS).map(k => `<button aria-pressed="${k == w}" data-w="${k}">${k}주</button>`).join("");
  view.innerHTML = `
    <h2>줄거리</h2>
    <div class="seg" style="max-width:100%">${btns}</div>
    <h2 style="margin-top:18px">《${esc(m.title)}》 <span class="muted small">${m.en ? esc(m.en) + ", " : ""}${m.year}</span></h2>
    <div class="panel"><ul class="plain">${s.info.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
    <h3>등장인물</h3>
    <div class="tablewrap"><table><thead><tr><th>인물</th><th>배우</th><th>역할 · 핵심 행동</th></tr></thead><tbody>${s.cast.map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>
    <h3>장면 순서</h3>
    <div class="acts">${s.acts.map(a => `<div class="act"><h4>${esc(a[0])}</h4><ol>${a[1].map(t => `<li>${esc(t)}</li>`).join("")}</ol></div>`).join("")}</div>
    <h3>실화와의 차이</h3>
    <div class="panel"><ul class="plain">${s.diffs.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
    <h3>수업에서 다루는 이유</h3>
    <div class="panel">${esc(s.why)}</div>`;
  view.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { ui.story = +b.dataset.w; renderStory(); });
}

/* ---------- 모의고사 ---------- */
function fmt(sec) { const m = Math.floor(Math.abs(sec) / 60), s = Math.abs(sec) % 60; return (sec < 0 ? "-" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"); }
function tick() {
  const e = ui.exam;
  e.sec -= 1;
  const el = $("#clock");
  if (el) { el.textContent = fmt(e.sec); el.classList.toggle("late", e.sec <= 720); }
  if (e.sec <= 0) stopTimer();
}
function startTimer() { const e = ui.exam; if (e.running) return; e.running = true; e.timer = setInterval(tick, 1000); }
function stopTimer() { const e = ui.exam; e.running = false; clearInterval(e.timer); e.timer = null; }

function grade(q, input) {
  const v = norm(input);
  return v.length > 0 && q.answers.some(a => norm(a) === v);
}
function setScore(q, ok, input, revealed) {
  const e = ui.exam, id = qId(q);
  e.res[id] = { ok, input, revealed };
  if (ok) delete S.wrong[id]; else S.wrong[id] = true;
  const qs = QUESTIONS.filter(x => x.set === e.set);
  const correct = qs.filter(x => e.res[qId(x)] && e.res[qId(x)].ok).length;
  if (S.best[e.set] == null || correct > S.best[e.set]) S.best[e.set] = correct;
  store.save();
}

function renderExam() {
  const e = ui.exam;
  let qs = QUESTIONS.filter(q => q.set === e.set).sort((a, b) => a.no - b.no);
  const all = qs;
  if (e.retry) qs = qs.filter(q => !(e.res[qId(q)] && e.res[qId(q)].ok));
  const setBtns = SET_IDS.map(n => `<button aria-pressed="${n === e.set}" data-s="${n}">${n === 6 ? "★ 기출" : n + "세트"}</button>`).join("");
  const done = all.filter(q => e.res[qId(q)]).length;
  const correct = all.filter(q => e.res[qId(q)] && e.res[qId(q)].ok).length;
  const mv = all.filter(q => q.type === "movie").length;
  view.innerHTML = `
    <h2>모의고사</h2>
    <div class="seg" style="max-width:100%">${setBtns}</div>
    <p class="small muted" style="margin:8px 0 12px">${e.set === 6 ? "선배 족보에 나온 키워드만 모은 세트예요. 1–5세트와 겹치지 않아요. " : ""}${all.length}문항 · 영화 ${mv} / 법 ${all.length - mv} · 빈칸·단답형. 답을 쓰고 Enter 또는 '확인'. '정답 보기'는 틀린 것으로 기록돼요.</p>
    <div class="timer">
      <span class="clock ${e.sec <= 720 ? "late" : ""}" id="clock" aria-live="off">${fmt(e.sec)}</span>
      <div class="row">
        <button id="tStart">${e.running ? "정지" : "시작"}</button>
        <button id="tReset">다시 30:00</button>
      </div>
      <div class="goal">시험 시간 30분 · 실제 분량 기준 목표 18분 (남은 12:00이 되면 금색)</div>
    </div>
    ${e.retry ? `<p class="note" style="margin-top:12px">틀린 문제만 다시 푸는 중이에요 (${qs.length}문항).</p>` : ""}
    <div class="qs">${qs.map(q => qHtml(q)).join("")}</div>
    <div class="panel score">
      <div class="big">${correct} / ${all.length}</div>
      <div class="small muted">푼 문제 ${done} · 최고 점수 ${S.best[e.set] ?? "–"}</div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="retry">틀린 문제만 다시 풀기</button>
        <button class="btn" id="reset">처음부터 다시</button>
      </div>
    </div>`;
  view.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { e.set = +b.dataset.s; e.res = {}; e.retry = false; renderExam(); window.scrollTo(0, 0); });
  $("#tStart").onclick = () => { e.running ? stopTimer() : startTimer(); renderExamTimerBtn(); };
  $("#tReset").onclick = () => { stopTimer(); e.sec = 1800; renderExam(); };
  $("#retry").onclick = () => {
    all.forEach(q => { const r = e.res[qId(q)]; if (r && !r.ok) delete e.res[qId(q)]; });
    e.retry = true; renderExam(); window.scrollTo(0, 0);
  };
  $("#reset").onclick = () => { e.res = {}; e.retry = false; renderExam(); window.scrollTo(0, 0); };
  qs.forEach(q => bindQ(q));
}
function renderExamTimerBtn() { const b = $("#tStart"); if (b) b.textContent = ui.exam.running ? "정지" : "시작"; }

function qHtml(q) {
  const id = qId(q), r = ui.exam.res[id];
  const kindLabel = q.kind === "blank" ? "빈칸" : "단답";
  let fb = "";
  if (r) {
    fb = r.ok
      ? `<div class="fb ok"><b class="r">정답</b> · ${esc(q.answers[0])}<div class="small">${esc(q.explain)}</div></div>`
      : `<div class="fb bad"><b class="w">${r.revealed ? "정답 확인" : "오답"}</b>${r.input && !r.revealed ? ` (내 답: ${esc(r.input)})` : ""} · 정답: <b>${esc(q.answers[0])}</b><div class="small">${esc(q.explain)}</div></div>`;
  }
  return `<div class="qcard ${r ? (r.ok ? "ok" : "bad") : ""}" id="c-${id}">
    <div class="qhead"><span class="qno">${String(q.no).padStart(2, "0")}</span><span class="tag wk">${weekLabel(q.week)}</span>${typeTag(q.type)}<span class="tag wk">${kindLabel}</span>${gichulTag(q.gichul)}${warnTag(q.uncertain)}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${r ? "" : `<form class="ansrow" data-q="${id}"><input id="in-${id}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.kind === "blank" ? "빈칸에 들어갈 말" : "답 입력"}" aria-label="${q.no}번 답"><button class="btn primary" type="submit">확인</button><button class="btn" type="button" data-reveal="${id}">정답 보기</button></form>`}
    ${fb}
  </div>`;
}
function bindQ(q) {
  const id = qId(q);
  const form = view.querySelector(`form[data-q="${id}"]`);
  if (!form) return;
  form.addEventListener("submit", ev => {
    ev.preventDefault();
    const val = $("#in-" + id).value;
    if (!val.trim()) { $("#in-" + id).focus(); return; }
    setScore(q, grade(q, val), val, false);
    refreshQ(q);
  });
  form.querySelector("[data-reveal]").onclick = () => { setScore(q, false, "", true); refreshQ(q); };
}
function refreshQ(q) {
  const id = qId(q), card = $("#c-" + id);
  if (!card) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = qHtml(q);
  card.replaceWith(tmp.firstElementChild);
  const e = ui.exam, all = QUESTIONS.filter(x => x.set === e.set);
  const correct = all.filter(x => e.res[qId(x)] && e.res[qId(x)].ok).length;
  const done = all.filter(x => e.res[qId(x)]).length;
  const big = view.querySelector(".score .big"), sub = view.querySelector(".score .small");
  if (big) big.textContent = `${correct} / ${all.length}`;
  if (sub) sub.textContent = `푼 문제 ${done} · 최고 점수 ${S.best[e.set] ?? "–"}`;
}

/* 타이머 바를 탭 바 바로 아래에 붙임 */
function syncStickyOffset() {
  const h = document.querySelector("header.top");
  if (h) document.documentElement.style.setProperty("--head-h", h.offsetHeight + "px");
}
window.addEventListener("resize", syncStickyOffset);
syncStickyOffset();

render();
</script>
</body>
